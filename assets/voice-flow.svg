<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-labelledby="title desc"><title id="title">Conversation, extraction, and decision logic</title><desc id="desc">A conceptual loop: conversation context feeds structured extraction and deterministic rules, which select the next question. Evaluation checks behavior across the loop.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#67e8ce"/></marker></defs><rect width="760" height="270" rx="6" fill="#142238"/><g font-family="Arial,sans-serif"><text x="28" y="32" fill="#91b7c5" font-size="11" letter-spacing="2">VOICE AGENT · CONCEPTUAL FLOW</text><g fill="#192e46" stroke="#4b617a"><rect x="28" y="62" width="210" height="112" rx="5"/><rect x="275" y="62" width="210" height="112" rx="5"/><rect x="522" y="62" width="210" height="112" rx="5"/></g><g fill="#e7eef9" font-size="20"><text x="47" y="101">Conversation</text><text x="294" y="101">Extraction</text><text x="541" y="101">Decision rules</text></g><g fill="#b5c6db" font-size="14"><text x="47" y="129">Prompt + turn history</text><text x="47" y="150">Question selection</text><text x="294" y="129">Structured fields</text><text x="294" y="150">Unknown vs confirmed</text><text x="541" y="129">Required information</text><text x="541" y="150">Continue or complete</text></g><g fill="none" stroke="#67e8ce" stroke-width="1.5" marker-end="url(#arrow)"><path d="M239 118 H269"/><path d="M486 118 H516"/><path d="M627 175 V205 H133 V180"/></g><text x="296" y="229" fill="#9bb5cb" font-size="12">NEXT QUESTION / UPDATED CONTEXT</text><text x="28" y="251" fill="#91b7c5" font-size="11">Validation: prompt checks · extraction regressions · scenario tests</text></g></svg>