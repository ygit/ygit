<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 510" role="img" aria-labelledby="title desc">
<title id="title">Voice-agent conversation flow</title><desc id="desc">Conversation context feeds extraction and decision rules. Updated context determines the next question. Prompt, extraction, and scenario tests validate the loop.</desc>
